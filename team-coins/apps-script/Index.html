<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root{
  --bg: #F7F7FC;
  --bg-deep: #F1F0FA;
  --card: #FFFFFF;
  --card-border: #E7E5F3;
  --gold: #6C5CE7;
  --gold-soft: rgba(108,92,231,0.10);
  --coral: #E8527A;
  --mint: #1FAE6E;
  --sky: #4A6CF7;
  --text: #17162B;
  --text-dim: #5B5A72;
  --text-faint: #9694AC;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  min-height:100vh;
  -webkit-font-smoothing: antialiased;
}

/* ============================================================
   SIDEBAR NAVIGATION SHELL — окремі "сторінки", а не один скрол
============================================================ */
.app-shell{ display:flex; min-height:100vh; align-items:flex-start; }
.sidebar{
  width: 250px; flex-shrink:0; background: var(--card); border-right:1px solid var(--card-border);
  padding: 20px 12px 20px; display:flex; flex-direction:column; gap:2px;
  min-height:100vh; position: sticky; top:0;
}
.sidebar-brand{ display:flex; align-items:center; gap:8px; padding: 4px 10px 6px; font-weight:800; font-size:16px; }
.sidebar-brand .who{ font-size:11px; color:var(--text-faint); font-weight:500; padding: 0 10px 16px; }
.sidebar-item{
  display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:9px;
  font-size:13.5px; font-weight:600; color:var(--text-dim); cursor:pointer; user-select:none;
}
.sidebar-item:hover{ background: var(--bg-deep); }
.sidebar-item.active{ background: var(--gold-soft); color: var(--gold); }
.sidebar-item .ic{ width:18px; text-align:center; flex-shrink:0; font-size:14px; }
.sidebar-item .lbl{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sidebar-badge{ background: var(--coral); color:#fff; font-size:10px; font-weight:800; border-radius:999px; padding:1px 6px; min-width:16px; text-align:center; }
.sidebar-section-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); margin:16px 10px 4px; font-weight:800; }
.sidebar-divider{ height:1px; background: var(--card-border); margin: 12px 6px; }

.main-wrap{ flex:1; min-width:0; }
.main-content{ max-width: 900px; margin: 0 auto; padding: 24px 28px 70px; }

.content-header{ display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom: 20px; flex-wrap: wrap; }
.content-title{ font-family:'Inter', sans-serif; font-size: 22px; font-weight:800; }
.content-header-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

.lang-toggle{ display:flex; border:1px solid var(--card-border); border-radius:999px; overflow:hidden; }
.lang-btn{ border:none; background: var(--card); color: var(--text-dim); font-family:'Inter',sans-serif; font-weight:700; font-size:11.5px; padding: 7px 12px; cursor:pointer; }
.lang-btn.active{ background: var(--gold); color:#FFFFFF; }

.pill{ display:flex; align-items:center; gap:8px; padding: 9px 15px; border-radius: 999px; border:1px solid var(--card-border); background: var(--card); font-weight:600; font-size: 13.5px; white-space:nowrap; }
.pill.coins{ border-color: rgba(108,92,231,0.35); }
.pill.kudos{ border-color: rgba(232,82,122,0.35); }
.pill.admin{ border-color: rgba(74,108,247,0.4); color: var(--sky); }

.announcement{
  background: var(--gold-soft); border: 1px solid rgba(108,92,231,0.35);
  border-radius: 14px; padding: 12px 16px; margin-bottom: 22px;
  font-size: 13px; color: var(--text); display:flex; align-items:center; gap:8px;
}

.section-title{ font-family:'Inter', sans-serif; font-size: 17px; font-weight:700; margin: 26px 0 4px; }
.section-title:first-child{ margin-top:0; }
.section-sub{ font-size:12.5px; color: var(--text-faint); margin-bottom:16px; }

.stat-cards{ display:grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap:14px; margin-bottom: 22px; }
.stat-card{ background: var(--card); border:1px solid var(--card-border); border-radius:16px; padding:16px 18px; }
.stat-card .lbl{ font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.03em; margin-bottom:6px; font-weight:700; }
.stat-card .val{ font-size:24px; font-weight:800; display:flex; align-items:center; gap:6px; }

.progress-panel{border-radius:18px;padding:18px 20px;margin-bottom:22px;border:1px solid rgba(108,92,231,0.22);background:linear-gradient(135deg,rgba(108,92,231,0.07),rgba(74,108,247,0.03));}
.progress-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:10px;}
.progress-title{font-size:15px;font-weight:700;}
.progress-value{font-size:12px;color:var(--text-dim);}
.progress-track{height:9px;border-radius:999px;background:var(--bg-deep);overflow:hidden;border:1px solid var(--card-border);}
.progress-fill{height:100%;background:var(--gold);border-radius:999px;transition:width .25s ease;}
.progress-note{font-size:11.5px;color:var(--text-faint);margin-top:8px;}

.history{display:flex;flex-direction:column;gap:8px;}
.history-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--card-border);font-size:12.5px;}
.history-item:last-child{border-bottom:none;}
.history-main{min-width:0;}
.history-main b{color:var(--text);}
.history-source{display:block;color:var(--text-faint);font-size:11px;margin-top:2px;}
.history-amount{font-weight:800;white-space:nowrap;}
.history-amount.earn{color:var(--mint);}
.history-amount.spend{color:var(--coral);}

.table-tabs{ display:flex; gap:8px; margin-bottom:14px; }
.table-tab{ font-size:12.5px; font-weight:700; padding:7px 13px; border-radius:999px; background:var(--bg-deep); color:var(--text-dim); cursor:pointer; }
.table-tab.active{ background: var(--text); color:#fff; }

.panel{ border-radius: 18px; padding: 20px; margin-bottom: 22px; border: 1px solid var(--card-border); background: var(--card); }
.panel.kudos-panel{ background: linear-gradient(135deg, rgba(232,82,122,0.05), rgba(108,92,231,0.03)); border-color: rgba(232,82,122,0.22); }
.panel.claim-panel{ background: linear-gradient(135deg, rgba(74,108,247,0.05), rgba(108,92,231,0.03)); border-color: rgba(74,108,247,0.22); }
.panel.admin-panel{ background: linear-gradient(135deg, rgba(108,92,231,0.06), rgba(232,82,122,0.03)); border-color: rgba(108,92,231,0.25); }
.panel-title{ font-family:'Inter', sans-serif; font-size: 16.5px; font-weight: 600; margin-bottom: 12px; display:flex; align-items:center; gap:6px; }
.panel-note{ font-size:12px; color:var(--text-dim); margin-bottom:10px; }

.form-row{ display:flex; gap:10px; flex-wrap: wrap; }
.form-row select, .form-row textarea, .form-row input[type=text], .form-row input[type=number]{
  background: var(--bg-deep); border: 1px solid var(--card-border); border-radius: 10px;
  padding: 10px 12px; color: var(--text); font-family:'Inter',sans-serif; font-size: 13.5px; outline: none;
}
.form-row select{ flex: 1 1 200px; }
.form-row textarea{ flex: 2 1 260px; resize: none; min-height: 40px; }
.form-row input[type=text]{ flex: 1 1 160px; }
.form-row input[type=number]{ width: 90px; }
.form-row select:focus, .form-row textarea:focus, .form-row input:focus{ border-color: var(--sky); }

.combo-wrap{ position: relative; flex: 1 1 200px; }
.combo-wrap input.combo-input{ width: 100%; }
.combo-dropdown{
  display:none; position:absolute; top:calc(100% + 4px); left:0; right:0; z-index: 20;
  background: var(--card); border:1px solid var(--card-border); border-radius:10px;
  max-height: 220px; overflow-y:auto; box-shadow: 0 8px 20px rgba(23,22,43,0.12);
}
.combo-item{ padding: 9px 12px; font-size:13.5px; cursor:pointer; }
.combo-item:hover, .combo-item.active{ background: var(--bg-deep); }
.combo-empty{ padding: 9px 12px; font-size:12.5px; color: var(--text-faint); }

.btn{
  border:none; border-radius:10px; padding:0 18px; height: 40px;
  font-weight:700; font-size:13.5px; cursor:pointer; font-family:'Inter',sans-serif;
}
.btn.pink{ background: var(--coral); color:#FFFFFF; }
.btn.blue{ background: var(--sky); color:#FFFFFF; }
.btn.gold{ background: var(--gold); color:#FFFFFF; }
.btn.mint{ background: var(--mint); color:#FFFFFF; }
.btn.ghost{ background: var(--bg-deep); color: var(--text-dim); }
.btn:disabled{ background: var(--card-border); color: var(--text-faint); cursor:not-allowed; }

.hint{ font-size:11.5px; color: var(--text-faint); margin: 6px 0 10px; }

.feed{ margin-top:14px; display:flex; flex-direction:column; gap:7px; }
.feed-item{ font-size:12.5px; color: var(--text-dim); }
.feed-item b{ color: var(--text); }
.feed-item.sent{ color: var(--text-dim); }
.feed-item.received{ color: var(--text); }

.badge{ display:inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight:700; }
.badge.pending{ background: rgba(108,92,231,0.18); color: var(--gold); }
.badge.approved{ background: rgba(31,174,110,0.18); color: var(--mint); }
.badge.rejected{ background: rgba(232,82,122,0.18); color: var(--coral); }

.sub-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding: 8px 0; border-bottom: 1px solid var(--card-border); font-size:12.5px; }
.sub-row:last-child{ border-bottom: none; }
.sub-row-main{ display:flex; flex-direction:column; gap:2px; }
.sub-row-main .cat{ color: var(--text); font-weight:600; }
.sub-row-main .coins{ color: var(--gold); font-weight:600; }

.pending-item{ padding: 10px 0; border-bottom: 1px solid var(--card-border); }
.pending-item:last-child{ border-bottom:none; }
.pending-top{ display:flex; justify-content:space-between; gap:8px; margin-bottom:4px; font-size:12.5px; }
.pending-top b{ color: var(--text); }
.pending-proof{ font-size:12px; color: var(--text-dim); margin-bottom:8px; }
.pending-actions{ display:flex; gap:8px; }
.pending-actions .btn{ height:32px; padding: 0 14px; font-size:12px; }

.admin-list{ display:flex; flex-direction:column; gap:6px; margin-bottom: 12px; }
.admin-chip{ display:flex; justify-content:space-between; align-items:center; background: var(--bg-deep); border-radius:10px; padding:7px 12px; font-size:12.5px; }
.admin-chip .owner-tag{ font-size:10px; color: var(--text-faint); }
.admin-chip button{ background:none; border:none; color: var(--coral); cursor:pointer; font-size:12px; font-weight:700; }

.lb-card{ border-radius: 16px; padding: 16px 18px; border: 1px solid var(--card-border); background: var(--card); margin-bottom: 18px; }
.lb-card-title{ font-family:'Inter', sans-serif; font-size: 14.5px; font-weight: 600; margin-bottom: 10px; display:flex; align-items:center; gap:6px; }
.lb-card-note{ font-size:11px; color: var(--text-faint); margin: -6px 0 10px; line-height:1.4; }
.lb-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px solid var(--card-border); font-size:13px; }
.lb-row:last-child{ border-bottom:none; }
.lb-row-left{ display:flex; align-items:flex-start; gap:8px; min-width:0; }
.lb-marker{ display:inline-block; width:20px; flex-shrink:0; color: var(--text-faint); font-weight:700; font-size:13px; line-height:1.3; }
.lb-name{ font-weight:600; font-size:13px; color: var(--text); line-height:1.3; }
.lb-value{ color: var(--gold); font-weight:700; font-size:13px; white-space:nowrap; flex-shrink:0; padding-top:1px; }

.grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap:14px; }
.card{ background: var(--card); border:1px solid var(--card-border); border-radius:16px; overflow:hidden; display:flex; flex-direction:column; }
.card.sold-out{ opacity:.5; }
.card-media{ height:100px; display:flex; align-items:center; justify-content:center; font-size:42px; background: var(--bg-deep); }
.card-body{ padding:13px 14px 14px; display:flex; flex-direction:column; gap:7px; flex:1; }
.card-top{ display:flex; justify-content:space-between; gap:8px; }
.card-name{ font-weight:600; font-size:13.5px; }
.card-price{ font-weight:700; font-size:13px; color: var(--gold); white-space:nowrap; }
.card-desc{ font-size:11.5px; color: var(--text-faint); min-height: 28px; line-height:1.4; }
.card-stock{ font-size:11px; color: var(--mint); }
.card-action{ margin-top:auto; border:none; border-radius:9px; padding:8px 0; font-weight:700; font-size:12.5px; cursor:pointer; font-family:'Inter',sans-serif; }
.card-action.buy{ background: var(--gold); color:#FFFFFF; }
.card-action.locked{ background: var(--bg-deep); color: var(--text-faint); cursor:not-allowed; }
.card-action.owned{ background: var(--mint); color:#FFFFFF; cursor:default; }

.toast{
  position: fixed; bottom: 22px; left:50%; transform: translateX(-50%) translateY(20px);
  background:#17162B; border:1px solid rgba(255,255,255,0.1); color: #FFFFFF;
  padding: 11px 18px; border-radius: 12px; font-size: 13px; opacity:0; transition: opacity .25s, transform .25s;
  pointer-events:none; box-shadow: 0 8px 24px rgba(0,0,0,.25); max-width: 90%; text-align:center;
}
.toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }
.loading-note, .error-note{ color: var(--text-faint); font-size:17px; font-weight:600; width:100%; min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; }
.error-note{ color: #D6395C; }

.modal-overlay{
  position: fixed; inset: 0; background: rgba(23,16,28,0.72);
  display:flex; align-items:center; justify-content:center; padding: 20px;
  z-index: 100; opacity:0; pointer-events:none; transition: opacity .18s;
}
.modal-overlay.show{ opacity:1; pointer-events:auto; }
.modal-box{
  background-color: #FFFFFF; opacity: 1;
  border:1px solid var(--card-border); border-radius: 18px;
  padding: 24px; max-width: 360px; width:100%; text-align:center;
  box-shadow: 0 20px 60px rgba(23,22,43,0.35);
  transform: translateY(8px) scale(.98); transition: transform .18s;
}
.modal-overlay.show .modal-box{ transform: translateY(0) scale(1); }
.modal-emoji{ font-size: 40px; margin-bottom: 10px; }
.modal-title{ font-family:'Inter', sans-serif; font-size: 18px; font-weight:600; margin-bottom: 6px; }
.modal-sub{ font-size: 13px; color: var(--text-dim); margin-bottom: 4px; }
.modal-price{ font-size: 15px; color: var(--gold); font-weight:700; margin-bottom: 18px; }
.modal-actions{ display:flex; gap:10px; }
.modal-btn{ flex:1; border:none; border-radius:10px; padding: 11px 0; font-weight:700; font-size:13.5px; cursor:pointer; font-family:'Inter',sans-serif; }
.modal-btn.cancel{ background: var(--bg-deep); color: var(--text-dim); }
.modal-btn.confirm{ background: var(--gold); color:#FFFFFF; }
.modal-btn:disabled{ opacity:.6; cursor:not-allowed; }
.modal-success .modal-title{ color: var(--mint); }
.modal-success .modal-sub{ margin-bottom: 18px; }
.modal-btn.close-success{ background: var(--mint); color:#FFFFFF; width:100%; }

.cat-groups{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom: 12px; }
.cat-group-btn{ border:1px solid var(--card-border); background: var(--bg-deep); color: var(--text-dim); border-radius:999px; padding:8px 14px; font-family:'Inter',sans-serif; font-weight:700; font-size:12.5px; cursor:pointer; white-space:nowrap; }
.cat-group-btn.active{ background: var(--sky); border-color: var(--sky); color:#FFFFFF; }
.cat-group-empty{ font-size:12.5px; color:var(--text-faint); padding: 10px 0; }
.campaign-chip-group{ margin-bottom: 14px; }
.campaign-chip-group-title{ font-size:11.5px; font-weight:700; color: var(--text-faint); text-transform:uppercase; letter-spacing:.03em; margin: 10px 0 6px; }

.card.achievement-locked{ opacity:.55; }
.achievement-badge-emoji{ font-size:36px; }
.achievement-coins-tag{ font-size:11px; font-weight:800; color:var(--gold); background:var(--gold-soft); border-radius:999px; padding:2px 10px; display:inline-block; }

.ach-teaser{ border:1px solid var(--card-border); background:var(--card); border-radius:14px; padding:14px 16px; margin-bottom:10px; cursor:pointer; }
.ach-teaser-head{ display:flex; align-items:center; gap:12px; }
.ach-teaser-emoji{ font-size:26px; flex-shrink:0; }
.ach-teaser-body{ flex:1; min-width:0; }
.ach-teaser-title{ font-weight:700; font-size:13.5px; display:flex; align-items:center; gap:8px; }
.ach-teaser-frac{ font-size:11.5px; color:var(--text-faint); font-weight:700; }
.ach-teaser-track{ height:6px; border-radius:999px; background:var(--bg-deep); overflow:hidden; margin-top:6px; }
.ach-teaser-fill{ height:100%; background:var(--gold); border-radius:999px; }
.ach-teaser-chevron{ color:var(--text-faint); font-size:12px; flex-shrink:0; transition:transform .15s; }
.ach-teaser.expanded .ach-teaser-chevron{ transform:rotate(90deg); }
.ach-teaser-tasks{ display:none; margin-top:12px; padding-top:12px; border-top:1px solid var(--card-border); }
.ach-teaser.expanded .ach-teaser-tasks{ display:block; }
.ach-task-row{ display:flex; align-items:center; gap:9px; padding:5px 0; font-size:12.5px; }
.ach-task-row .chk{ width:16px; height:16px; border-radius:5px; border:1.5px solid var(--card-border); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:10px; }
.ach-task-row.done .chk{ background:var(--mint); border-color:var(--mint); color:#fff; }
.ach-task-row.done .lbl{ color:var(--text-faint); text-decoration:line-through; }
.ach-task-row .amt{ margin-left:auto; color:var(--gold); font-weight:700; font-size:11.5px; }
.ach-part-tag{ display:inline-block; font-size:10.5px; font-weight:700; color:var(--gold); background:var(--gold-soft); border-radius:999px; padding:2px 9px; margin-top:6px; }

@media (max-width: 560px){
  .sidebar{ width: 210px; padding: 16px 8px; }
  .sidebar-item .lbl{ font-size:12.5px; }
  .main-content{ padding: 18px 14px 60px; }
}
</style>
</head>
<body>

<div class="app-shell" id="app">
  <div class="loading-note">Loading your balance… / Завантажуємо ваш баланс…</div>
</div>
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modal-overlay"><div class="modal-box" id="modal-box"></div></div>

<script>
const BUILD_VERSION = '2026-09-15 · v28';

let state = null;
let pendingRewardId = null;

let currentLang = (function(){
  try { return localStorage.getItem('teamcoins_lang') || 'ua'; } catch(e){ return 'ua'; }
})();

// Сторінкова навігація: currentPage визначає, яка "сторінка" рендериться
// в main-content, а сайдбар підсвічує активний пункт.
let currentPage = 'home';
let activeClaimGroup = 'base';
let myRecordsFilter = 'all';
let statsData = null;
let statsLoading = false;
let expandedAchievementId = null;
function toggleAchievementTeaser_(id){ expandedAchievementId = (expandedAchievementId === id) ? null : id; render(); }

function setPage(pageId){
  currentPage = pageId;
  if (pageId === 'stats' && !statsData && !statsLoading) loadStats_();
  render();
}

const NAV_ITEMS = [
  { id:'home',        icon:'🏠', labelKey:'navHome' },
  { id:'kudos',       icon:'💜', labelKey:'navKudos' },
  { id:'claim',       icon:'📝', labelKey:'navClaim' },
  { id:'shop',        icon:'🎁', labelKey:'navShop' },
  { id:'leaders',     icon:'🏆', labelKey:'navLeaders' },
  { id:'achievements',icon:'🏅', labelKey:'navAchievements' },
  { id:'feedback',    icon:'💬', labelKey:'navFeedback' },
];
const ADMIN_NAV_ITEMS = [
  { id:'pending',           icon:'🛠️', labelKey:'navPending',           visible: s => s.isAdmin,                 badge: s => s.pendingSubmissions.length },
  { id:'secretcoin',        icon:'🪙', labelKey:'navSecretCoin',        visible: s => s.isAdmin || s.isManager },
  { id:'stats',             icon:'📊', labelKey:'navStats',             visible: s => s.isAdmin },
  { id:'people',            icon:'👥', labelKey:'navPeople',            visible: s => s.isAdmin },
  { id:'shopadmin',         icon:'🎁', labelKey:'navShopAdmin',         visible: s => s.isAdmin },
  { id:'campaignadmin',     icon:'🎯', labelKey:'navCampaignAdmin',     visible: s => s.isAdmin },
  { id:'suggestionsadmin',  icon:'💬', labelKey:'navSuggestionsAdmin',  visible: s => s.isAdmin,                 badge: s => s.pendingSuggestions.length },
];

const T = {
  ua: {
    loading: 'Завантажуємо ваш баланс…',
    admin: 'Адмін',
    managerBadge: 'Менеджер',
    navHome: 'Мій кабінет',
    navKudos: 'Дати Kudos',
    navClaim: 'Подати заявку',
    navShop: 'Reward Shop',
    navLeaders: 'Лідери',
    navAchievements: 'Ачівки',
    navFeedback: 'Відгуки',
    navPending: 'Заявки на розгляд',
    navSecretCoin: 'Secret Coin',
    navStats: 'Статистика',
    navPeople: 'Адміни та менеджери',
    navShopAdmin: 'Товари Reward Shop',
    navCampaignAdmin: 'Кампанійні активності',

function translateError_(raw){
  if (!raw) return raw;
  const cleaned = String(raw).replace(/^Error:\s*/i, '').trim();
  const parts = cleaned.split('|');
  const code = parts[0];
  const params = parts.slice(1);
  const dict = ERR[currentLang] || ERR.ua;
  const entry = dict[code];
  if (!entry) {
    return currentLang === 'en'
      ? 'Something went wrong. Please try again, or contact HR if it keeps happening.'
      : 'Щось пішло не так. Спробуйте ще раз, або зверніться до HR, якщо це повторюється.';
  }
  return typeof entry === 'function' ? entry.apply(null, params) : entry;
}

function setLang(lang){
  currentLang = lang;
  try { localStorage.setItem('teamcoins_lang', lang); } catch(e){}
  render();
}

function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> el.classList.remove('show'), 5000);
}
function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function fmt(n){ return Number(n).toLocaleString(currentLang === 'en' ? 'en-US' : 'uk-UA'); }
function statusBadge(status){
  if (status === 'Approved') return `<span class="badge approved">${t('statusApproved')}</span>`;
  if (status === 'Rejected') return `<span class="badge rejected">${t('statusRejected')}</span>`;
  return `<span class="badge pending">${t('statusPending')}</span>`;
}
function catLabel(c){ return currentLang === 'en' && c.labelEn ? c.labelEn : c.label; }
function stripLeadingEmoji_(s){ const i = s.indexOf(' '); return i === -1 ? s : s.slice(i + 1); }
function catProofHint(c){ return currentLang === 'en' && c.proofHintEn ? c.proofHintEn : c.proofHint; }
function rewardName(r){ return currentLang === 'en' && r.nameEn ? r.nameEn : r.name; }
function rewardDesc(r){ return currentLang === 'en' && r.descEn ? r.descEn : r.desc; }
function campaignGroupLabel(g){ return currentLang === 'en' && g.groupEn ? g.groupEn : g.group; }
function campaignTitle(c){ return currentLang === 'en' && c.titleEn ? c.titleEn : c.title; }
function campaignProofHint(c){ return currentLang === 'en' && c.proofHintEn ? c.proofHintEn : (c.proofHint || ''); }
function achievementLabel(a){ return currentLang === 'en' && a.labelEn ? a.labelEn : a.label; }
function achievementDesc(a){ return currentLang === 'en' && a.descEn ? a.descEn : a.desc; }

function groupCampaignCategories_(list){
  const order = [];
  const byGroup = {};
  (list || []).forEach(c => {
    if (!byGroup[c.groupId]) {
      byGroup[c.groupId] = { groupId: c.groupId, group: c.group, groupEn: c.groupEn, items: [] };
      order.push(c.groupId);
    }
    byGroup[c.groupId].items.push(c);
  });
  return order.map(id => byGroup[id]);
}

// JS-порт groupIdFromText_ з Code.gs.
function groupIdFromText_(text){
  const base = String(text || '').trim().toLowerCase().replace(/[^a-z0-9а-яіїєґ]+/gi, '-').replace(/^-+|-+$/g, '');
  return base || 'group';
}

// Об'єднує кампанійні групи з базовими категоріями, які мають displayGroup.
function buildDisplayGroups_(earnCategories, campaignCategories){
  const groups = groupCampaignCategories_(campaignCategories);
  (earnCategories || []).filter(c => c.displayGroup).forEach(c => {
    const gid = groupIdFromText_(c.displayGroup);
    let grp = groups.find(g => g.groupId === gid);
    if (!grp) { grp = { groupId: gid, group: c.displayGroup, groupEn: c.displayGroupEn || c.displayGroup, items: [] }; groups.push(grp); }
    grp.items.push({
      id: c.id, coins: c.coins, __base: true,
      title: stripLeadingEmoji_(catLabel(c)), titleEn: c.labelEn ? stripLeadingEmoji_(c.labelEn) : undefined,
      proofHint: c.proofHint, proofHintEn: c.proofHintEn,
    });
  });
  return groups;
}

function findSelectedCategory_(id){
  const base = (state.earnCategories || []).find(c => c.id === id);
  if (base) return Object.assign({ __base: true }, base);
  const campaign = (state.campaignCategories || []).find(c => c.id === id);
  if (campaign) return Object.assign({ __base: false }, campaign);
  return null;
}

// потрапляє: він залежить від рішення менеджера, а не від дій самої людини.
function renderAchievementTeasers_(){
  const notEarned = (state.achievements || []).filter(a => !a.earned && a.id !== 'start' && a.id !== 'secret_coin_irreplaceable');
  if (!notEarned.length) return '';
  const sorted = notEarned.slice().sort((a, b) => {
    const pa = a.progress ? a.progress.current / a.progress.target : 0;
    const pb = b.progress ? b.progress.current / b.progress.target : 0;
    return pb - pa;
  });

  const cardsHtml = sorted.map(a => {
    const cur = a.progress ? a.progress.current : 0;
    const tgt = a.progress ? a.progress.target : 1;
    const pct = Math.max(0, Math.min(100, Math.round((cur / tgt) * 100)));
    const expanded = expandedAchievementId === a.id;
    const tasksHtml = a.tasks ? a.tasks.map(task => `
      <div class="ach-task-row ${task.done ? 'done' : ''}">
        <span class="chk">${task.done ? '✓' : ''}</span>
        <span class="lbl">${escapeHtml(currentLang === 'en' && task.labelEn ? task.labelEn : task.label)}</span>
        <span class="amt">+${task.coins} ${state.currencyEmoji}</span>
      </div>`).join('') : `<div class="hint" style="margin:0;">${escapeHtml(achievementDesc(a))}</div>`;

    return `
      <div class="ach-teaser ${expanded ? 'expanded' : ''}" onclick="toggleAchievementTeaser_('${a.id}')">
        <div class="ach-teaser-head">
          <div class="ach-teaser-emoji">${a.emoji}</div>
          <div class="ach-teaser-body">
            <div class="ach-teaser-title">${escapeHtml(achievementLabel(a))} <span class="ach-teaser-frac">${cur} / ${tgt}</span></div>
            <div class="ach-teaser-track"><div class="ach-teaser-fill" style="width:${pct}%"></div></div>
          </div>
          <div class="ach-teaser-chevron">▶</div>
        </div>
        <div class="ach-teaser-tasks">${tasksHtml}</div>
      </div>`;
  }).join('');

  return `
    <div class="section-title" style="margin-top:0;">${t('achTeaserTitle')}</div>
    ${cardsHtml}
  `;
}

const DRAFT_TEXT_FIELD_IDS = ['kudos-msg', 'claim-proof', 'new-admin-email', 'new-manager-email', 'sk-coins-1', 'sk-reason', 'kudos-to-search', 'kudos-to', 'sk-to-1-search', 'sk-to-1', 'new-reward-name', 'new-reward-name-en', 'new-reward-price', 'new-reward-emoji', 'new-reward-desc', 'new-reward-desc-en', 'new-reward-stock', 'suggestion-text', 'new-campaign-group', 'new-campaign-title', 'new-campaign-coins', 'new-campaign-proof'];
const DRAFT_SELECT_FIELD_IDS = ['claim-category'];
const ALL_DRAFT_FIELD_IDS = DRAFT_TEXT_FIELD_IDS.concat(DRAFT_SELECT_FIELD_IDS);

// Зберігає введений текст і фокус між перерендерами, щоб автооновлення
// не стирало чернетку.
function captureDraftState_(){
  const saved = {};
  ALL_DRAFT_FIELD_IDS.forEach(function(id){
    const el = document.getElementById(id);
    if (!el) return;
    saved[id] = el.tagName === 'SELECT' ? el.selectedIndex : el.value;
  });
  const active = document.activeElement;
  saved.__focusId = (active && active.id) ? active.id : null;
  return saved;
}

function restoreDraftState_(saved){
  ALL_DRAFT_FIELD_IDS.forEach(function(id){
    if (!(id in saved)) return;
    const el = document.getElementById(id);
    if (!el) return;
    if (el.tagName === 'SELECT') el.selectedIndex = saved[id];
    else el.value = saved[id];
  });
  if (saved.__focusId) {
    const el = document.getElementById(saved.__focusId);
    if (el && el.focus) el.focus();
  }
}

function render(){
  const draft = captureDraftState_();
  renderInner_();
  restoreDraftState_(draft);
}

function updateClaimHint(){
  const sel = document.getElementById('claim-category');
  if (!sel || !state) return;
  const found = findSelectedCategory_(sel.value);
  let hintText = '';
  let achievementId = null;
  if (found) {
    if (found.__base) { hintText = catProofHint(found); achievementId = found.achievementId || null; }
    else { hintText = campaignProofHint(found); }
  }
  const hintEl = document.getElementById('claim-hint');
  if (hintEl) hintEl.textContent = hintText;

  const tagEl = document.getElementById('claim-ach-tag');
  if (tagEl) {
    if (achievementId) {
      const ach = (state.achievements || []).find(a => a.id === achievementId);
      const label = ach ? achievementLabel(ach) : achievementId;
      const emoji = ach ? ach.emoji : '🏅';
      tagEl.innerHTML = `<span class="ach-part-tag">${emoji} ${currentLang === 'en' ? 'Part of achievement' : 'Частина ачівки'}: ${escapeHtml(label)}</span>`;
    } else {
      tagEl.innerHTML = '';
    }
  }
}

function comboMatches_(query){
  const q = (query || '').trim().toLowerCase();
  const list = (state && state.colleagues) ? state.colleagues : [];
  if (!q) return list.slice(0, 8);
  return list.filter(c => c.name.toLowerCase().includes(q) || c.email.toLowerCase().includes(q)).slice(0, 8);
}

function renderComboDropdown_(prefix, query){
  const dropdown = document.getElementById(prefix + '-dropdown');
  if (!dropdown) return;
  const matches = comboMatches_(query);
  if (!matches.length) {
    dropdown.innerHTML = `<div class="combo-empty">${currentLang === 'en' ? 'No matches' : 'Нічого не знайдено'}</div>`;
  } else {
    dropdown.innerHTML = matches.map(c =>
      `<div class="combo-item" onmousedown="selectCombo_('${prefix}','${escapeHtml(c.email)}')">${escapeHtml(c.name)}</div>`
    ).join('');
  }
  dropdown.style.display = 'block';
}

function onComboInput_(prefix){
  const hidden = document.getElementById(prefix);
  if (hidden) hidden.value = '';
  renderComboDropdown_(prefix, document.getElementById(prefix + '-search').value);
}

function onComboFocus_(prefix){
  renderComboDropdown_(prefix, document.getElementById(prefix + '-search').value);
}

function selectCombo_(prefix, email){
  const c = (state.colleagues || []).find(x => x.email === email);
  const hidden = document.getElementById(prefix);
  const search = document.getElementById(prefix + '-search');
  if (hidden) hidden.value = email;
  if (search) search.value = c ? c.name : email;
  const dropdown = document.getElementById(prefix + '-dropdown');
  if (dropdown) { dropdown.style.display = 'none'; dropdown.innerHTML = ''; }
}

document.addEventListener('click', function(e){
  document.querySelectorAll('.combo-dropdown').forEach(function(d){
    const wrap = d.closest('.combo-wrap');
    if (wrap && !wrap.contains(e.target)) d.style.display = 'none';
  });
});

function loadState(){
  google.script.run
    .withSuccessHandler(function(s){ state = s; render(); })
    .withFailureHandler(function(err){
      document.getElementById('app').innerHTML = '<div class="error-note">' + escapeHtml(translateError_(err.message || String(err))) + '</div>';
    })
    .getState();
}

function openConfirm(rewardId){
  const r = state.rewards.find(x => x.id === rewardId);
  if (!r) return;
  pendingRewardId = rewardId;
  const box = document.getElementById('modal-box');
  box.className = 'modal-box';
  box.innerHTML = `
    <div class="modal-emoji">${r.emoji}</div>
    <div class="modal-title">${escapeHtml(rewardName(r))}</div>
    <div class="modal-sub">${escapeHtml(rewardDesc(r))}</div>
    <div class="modal-price">${fmt(r.price)} ${t('confirmFromBalance')(state.currencyEmoji)}</div>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeModal()">${t('confirmCancel')}</button>
      <button class="modal-btn confirm" id="confirm-btn" onclick="confirmPurchase()">${t('confirmSubmit')}</button>
    </div>`;
  showModal_();
}
function showModal_(){
  window.scrollTo(0, 0);
  document.getElementById('modal-overlay').classList.add('show');
}

function closeModal(){ document.getElementById('modal-overlay').classList.remove('show'); pendingRewardId = null; }

function openSuggestionsArchive(){
  const box = document.getElementById('modal-box');
  box.className = 'modal-box';
  box.innerHTML = `<div class="modal-title">${t('suggestionsArchiveTitle')}</div><div class="modal-sub">${t('suggestionsArchiveLoading')}</div>`;
  showModal_();

  google.script.run
    .withSuccessHandler(function(archive){ renderSuggestionsArchive_(archive); })
    .withFailureHandler(function(err){
      const box2 = document.getElementById('modal-box');
      box2.innerHTML = `<div class="modal-title">${t('suggestionsArchiveTitle')}</div><div class="modal-sub">${escapeHtml(translateError_(err.message || String(err)))}</div><button class="modal-btn confirm" onclick="closeModal()">${t('statsCloseBtn')}</button>`;
    })
    .getSuggestionsArchive();
}

function renderSuggestionsArchive_(archive){
  const listHtml = archive.length
    ? archive.map(sg => `
        <div class="pending-item">
          <div class="pending-top"><b>${escapeHtml(sg.name)}</b></div>
          <div class="pending-proof" style="margin-bottom:0;">${escapeHtml(sg.text)}</div>
        </div>`).join('')
    : `<div class="hint">${t('suggestionsArchiveEmpty')}</div>`;

  const box = document.getElementById('modal-box');
  box.className = 'modal-box';
  box.innerHTML = `
    <div class="modal-title" style="text-align:left;">${t('suggestionsArchiveTitle')}</div>
    <div style="text-align:left; max-height:60vh; overflow-y:auto; margin:14px 0;">${listHtml}</div>
    <button class="modal-btn confirm" style="width:100%;" onclick="closeModal()">${t('statsCloseBtn')}</button>
  `;
}

function confirmPurchase(){
  if (!pendingRewardId) return;
  const btn = document.getElementById('confirm-btn');
  const cancelBtn = document.querySelector('.modal-btn.cancel');
  btn.disabled = true; cancelBtn.disabled = true; btn.textContent = t('confirmProcessing');
  const rewardId = pendingRewardId;
  const r = state.rewards.find(x => x.id === rewardId);

  google.script.run
    .withSuccessHandler(function(s){ state = s; render(); showSuccessModal(r); })
    .withFailureHandler(function(err){
      btn.disabled = false; cancelBtn.disabled = false; btn.textContent = t('confirmSubmit');
      showToast(translateError_(err.message || String(err)));
      loadState();
    })
    .buyReward(rewardId);
}
function showSuccessModal(r){
  const box = document.getElementById('modal-box');
  box.className = 'modal-box modal-success';
  box.innerHTML = `
    <div class="modal-emoji">🎉</div>
    <div class="modal-title">${t('successTitle')}</div>
    <div class="modal-sub">${t('successSub')(escapeHtml(rewardName(r)))}</div>
    <button class="modal-btn close-success" onclick="closeModal()">${t('successClose')}</button>`;
}

function sendKudos(){
  const toEl = document.getElementById('kudos-to');
  const toSearchEl = document.getElementById('kudos-to-search');
  const msgEl = document.getElementById('kudos-msg');
  const sendBtn = document.getElementById('kudos-send');
  const to = toEl.value, msg = msgEl.value.trim();
  if (!to){ showToast(t('toastKudosChoose')); return; }
  if (!msg){ showToast(t('toastKudosReason')); return; }

  const originalLabel = sendBtn.textContent;
  sendBtn.disabled = true; sendBtn.textContent = t('kudosSending');
  toSearchEl.disabled = true; msgEl.disabled = true;

  google.script.run
    .withSuccessHandler(function(s){
      toEl.value = ''; toSearchEl.value = ''; msgEl.value = '';
      state = s; render();
      showToast(t('toastKudosSent'));
    })
    .withFailureHandler(function(err){
      showToast(translateError_(err.message || String(err)));
      sendBtn.disabled = false; sendBtn.textContent = originalLabel;
      toSearchEl.disabled = false; msgEl.disabled = false;
      loadState();
    })
    .sendKudos(to, msg);
}

function submitClaim(){
  const catEl = document.getElementById('claim-category');
  const proofEl = document.getElementById('claim-proof');
  const btn = document.getElementById('claim-submit');
  const proof = proofEl.value.trim();
  if (!proof){ showToast(t('toastClaimProof')); return; }

  const original = btn.textContent;
  btn.disabled = true; btn.textContent = t('claimSending');

  google.script.run
    .withSuccessHandler(function(s){
      proofEl.value = ''; catEl.selectedIndex = 0;
      state = s; render();
      showToast(t('toastClaimSent'));
    })
    .withFailureHandler(function(err){
      showToast(translateError_(err.message || String(err)));
      btn.disabled = false; btn.textContent = original;
      loadState();
    })
    .submitClaim(catEl.value, proof);
}

  const nameEl = document.getElementById('new-reward-name');

function grantSecretCoin(){
  const to1El = document.getElementById('sk-to-1');
  const to1SearchEl = document.getElementById('sk-to-1-search');
  const coins1El = document.getElementById('sk-coins-1');
  const reasonEl = document.getElementById('sk-reason');
  const errorEl = document.getElementById('sk-error');
  errorEl.style.display = 'none';

  const to1 = to1El.value;
  const coins1 = parseInt((coins1El.value || '').replace(/\D/g, ''), 10) || 0;
  const reason = reasonEl.value.trim();

  if (!to1 || coins1 <= 0){ showToast(t('toastSkChoose')); return; }
  if (!reason){ showToast(t('toastSkReason')); return; }

  const entries = [{ email: to1, coins: coins1, reason: reason }];

  const btn = document.getElementById('sk-submit');
  btn.disabled = true; btn.textContent = t('secretCoinSending');

  google.script.run
    .withSuccessHandler(function(s){
      to1El.value = ''; to1SearchEl.value = ''; coins1El.value = '';
      reasonEl.value = '';
      state = s; render();
      showToast(t('toastScSent'));
    })
    .withFailureHandler(function(err){
      const msg = translateError_(err.message || String(err));
      showToast(msg);
      const errEl = document.getElementById('sk-error');
      if (errEl){ errEl.textContent = '⚠️ ' + msg; errEl.style.display = 'block'; }
      btn.disabled = false; btn.textContent = t('secretCoinSubmitBtn');
    })
    .grantSecretCoin(entries);
}

// Тихе автооновлення раз на хвилину — пропускається, поки людина щось вводить.
const POLL_INTERVAL_MS = 60000;
let pollTimer = null;

function isActivelyEditing_(){
  const el = document.activeElement;
  if (!el) return false;
  const tag = el.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
}

function hasUnsavedDraft_(){
  const textDirty = DRAFT_TEXT_FIELD_IDS.some(function(id){
    const el = document.getElementById(id);
    return el && el.value && el.value.trim().length > 0;
  });
  if (textDirty) return true;
  return DRAFT_SELECT_FIELD_IDS.some(function(id){
    const el = document.getElementById(id);
    return el && el.selectedIndex > 0;
  });
}

function shouldSkipRefresh_(){
  return isActivelyEditing_() || hasUnsavedDraft_();
}

function silentRefresh(){
  if (pendingRewardId) return;
  if (document.hidden) return;
  if (shouldSkipRefresh_()) return;

  google.script.run
    .withSuccessHandler(function(s){
      if (shouldSkipRefresh_() || pendingRewardId) return;
      state = s; render();
      updateClaimHint();
    })
    .withFailureHandler(function(){})
    .getState();
}
function startPolling(){ if (!pollTimer) pollTimer = setInterval(silentRefresh, POLL_INTERVAL_MS); }

loadState();
startPolling();
